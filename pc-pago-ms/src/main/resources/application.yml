spring:
  application:
    name: pc-pago-ms
  profiles:
    active: dev
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:18888}"

server:
  port: 8085

frontend:
  url: ${FRONTEND_URL:http://localhost:4200}

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:${MP_ACCESS_TOKEN:APP_USR-7798988609356730-111819-96e585696ba88ed36d038c742adc400c-3649448406}}
  public-key: ${MERCADOPAGO_PUBLIC_KEY:${MP_PUBLIC_KEY:APP_USR-9f3f0419-e6bf-4800-ab6b-50bfd5db448e}}
  currency: PEN
  auto-return: approved

culqi:
  secret-key: ${CULQI_SECRET_KEY:sk_test_g83TjoIFV36RcQqK}
  public-key: ${CULQI_PUBLIC_KEY:pk_test_S6cbeiPZqYemD1lH}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://zipkin:9411}/api/v2/spans

logging:
  pattern:
    correlation: "[%X{traceId:-} %X{spanId:-}]"
  level:
    root: INFO
    pe.edu.upeu.eniaclabs: DEBUG