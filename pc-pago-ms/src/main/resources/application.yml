spring:
  application:
    name: pc-pago-ms
  profiles:
    active: dev
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:18888}"

server:
  port: 8085

frontend:
  url: ${FRONTEND_URL:http://localhost:4200}

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:APP_USR-7709062323770834-102620-22d3ad8bb4a98ca436917a52a528a8a1-3796765560}
  public-key: ${MP_PUBLIC_KEY:APP_USR-62bf1793-3203-48e6-b913-2da50ee22fe7}
  currency: PEN
  auto-return: approved

culqi:
  secret-key: ${CULQI_SECRET_KEY:sk_test_g83TjoIFV36RcQqK}
  public-key: ${CULQI_PUBLIC_KEY:pk_test_S6cbeiPZqYemD1lH}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://zipkin:9411}/api/v2/spans

logging:
  pattern:
    correlation: "[%X{traceId:-} %X{spanId:-}]"
  level:
    root: INFO
    pe.edu.upeu.eniaclabs: DEBUG