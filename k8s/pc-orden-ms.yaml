apiVersion: v1
kind: Namespace
metadata:
  name: eniaclabs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pc-orden-ms
  namespace: eniaclabs
  labels:
    app: pc-orden-ms
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pc-orden-ms
  template:
    metadata:
      labels:
        app: pc-orden-ms
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: pc-orden-ms
          image: eniaclabs/pc-orden-ms:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: pc-orden-config
            - secretRef:
                name: pc-orden-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: pc-orden-ms
  namespace: eniaclabs
spec:
  type: ClusterIP
  selector:
    app: pc-orden-ms
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pc-orden-ms-hpa
  namespace: eniaclabs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pc-orden-ms
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pc-orden-config
  namespace: eniaclabs
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVICES_CATALOGO_URL: "http://pc-catalogo-ms.eniaclabs.svc.cluster.local:8080"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: pc-orden-secrets
  namespace: eniaclabs
type: Opaque
stringData:
  DB_USER: "eniaclabs"
  DB_PASS: "eniaclabs_prod_secret"
  JWT_SECRET: ""