site_name: ENIAC Labs - Ecosistema Distribuido
site_description: Documentacion oficial de la arquitectura de microservicios para ENIAC Labs
site_author: Eliceo Parillo Mostajo & Laura Vargas Cristhian Paul

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Inicio: index.md
  - Arquitectura C4 Model:
      - Resumen C4: c4-model/index.md
      - Nivel 1 - Contexto: c4-model/nivel1-contexto.md
      - Nivel 2 - Contenedores: c4-model/nivel2-contenedores.md
      - Nivel 3 - Componentes: c4-model/nivel3-componentes.md
      - Nivel 4 - Código y Clases: c4-model/nivel4-codigo.md
  - Proyecto Sello:
      - Brief del Proyecto: proyecto-sello/brief.md
      - Producto Unidad 1: proyecto-sello/u1-producto.md
      - Producto Unidad 2: proyecto-sello/u2-producto.md
  - Sesiones Unidad 1:
      - S01 - Servicio Base: sesiones/S01_Construccion_Servicio_Base.md
      - S02 - Config Server: sesiones/S02_Configuracion_Centralizada_Ambientes.md
      - S03 - Eureka y Concurrencia: sesiones/S03_Registro_Descubrimiento_Ejecucion_Concurrente.md
      - S04 - API Gateway WebMVC: sesiones/S04_Punto_Unico_Acceso_Distribucion_Trafico.md
      - S05 - Evaluacion U1: sesiones/S05_Evaluacion_Unidad_1.md
  - Sesiones Unidad 2:
      - S06 - Comunicación Síncrona Resiliente: sesiones/S06_Comunicacion_Sincrona_Resiliente.md
      - S07 - Seguridad Distribuida: sesiones/S07_Seguridad_Distribuida_Control_Acceso.md
      - S07b - Reemplazo por Keycloak: sesiones/S07b_Seguridad_Distribuida_Keycloak.md
      - S08 - Mensajería Asíncrona Kafka: sesiones/S08_Mensajeria_Asincrona_Entre_Servicios.md
      - S09 - Consistencia Distribuida (Saga): sesiones/S09_Consistencia_Distribuida_Procesos_Negocio.md
      - S10 - Observabilidad y Diagnóstico: sesiones/S10_Observabilidad_Diagnostico_Sistemas_Distribuidos.md
      - S11 - Integración Frontend Angular & Keycloak: sesiones/S11_Integracion_Cliente_Frontend_Angular_Keycloak.md
      - S12 - Evaluación de la Unidad II: sesiones/S12_Evaluacion_Unidad_2.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list