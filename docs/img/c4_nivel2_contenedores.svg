<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap');
      * { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      .c4-title { font-size: 26px; font-weight: 900; fill: #0f172a; }
      .box-person { fill: #08427b; stroke: #052c53; stroke-width: 2; }
      .box-container { fill: #1168bd; stroke: #0b4884; stroke-width: 1.8; }
      .box-db { fill: #2b78e4; stroke: #1155cc; stroke-width: 1.8; }
      .box-external { fill: #686868; stroke: #4d4d4d; stroke-width: 2; }
      .box-title { font-size: 13px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
      .box-tech { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; fill: #93c5fd; text-anchor: middle; }
      .box-desc { font-size: 9.5px; font-weight: 500; fill: #ffffff; text-anchor: middle; opacity: 0.95; }
      .rel-text { font-size: 10px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .rel-tech { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; font-weight: 600; fill: #64748b; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="c4-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" />

  <!-- HEADER -->
  <g transform="translate(60, 42)">
    <text x="0" y="0" class="c4-title">C4 MODEL - NIVEL 2: DIAGRAMA DE CONTENEDORES (CONTAINER DIAGRAM)</text>
    <text x="0" y="24" font-size="13px" font-weight="700" fill="#64748b">[Containers] Desglose de Contenedores Ejecutables, Puertos, Protocolos y Bases de Datos (16 Contenedores Docker)</text>
  </g>

  <!-- ================= PERSONAS (SUPERIOR IZQUIERDA) ================= -->
  <g transform="translate(60, 100)" filter="url(#shadow)">
    <circle cx="90" cy="-18" r="15" fill="#08427b" stroke="#052c53" stroke-width="2" />
    <rect width="180" height="95" rx="12" class="box-person" />
    <text x="90" y="28" class="box-title">Cliente / Gamer</text>
    <text x="90" y="42" font-size="9px" font-weight="700" fill="#dbeafe" text-anchor="middle">[PERSONA]</text>
    <text x="90" y="60" class="box-desc">Usuario de la tienda y builder</text>
    <text x="90" y="74" class="box-desc">Navegador Web y Celular</text>
  </g>

  <!-- ================= LÍMITE DEL SISTEMA ENIAC LABS ================= -->
  <rect x="290" y="85" width="1010" height="895" rx="20" fill="#f1f5f9" stroke="#0284c7" stroke-width="2" stroke-dasharray="8,6" />
  <text x="315" y="112" font-size="13px" font-weight="900" fill="#0284c7" letter-spacing="0.5px">LÍMITE DEL SISTEMA ENIAC LABS (DOCKER COMPOSE NETWORK: eniaclabs-network)</text>

  <!-- 1. FRONTEND SPA -->
  <g transform="translate(320, 135)" filter="url(#shadow)">
    <rect width="210" height="100" rx="12" class="box-container" />
    <text x="105" y="28" class="box-title">Frontend Gamer SPA</text>
    <text x="105" y="44" class="box-tech">[Angular 19, TypeScript :4200]</text>
    <text x="105" y="64" class="box-desc">Catálogo reactivo, carrito,</text>
    <text x="105" y="78" class="box-desc">PC Builder y mando PWA.</text>
  </g>
  <line x1="240" y1="150" x2="320" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#c4-arrow)" />

  <!-- 2. API GATEWAY -->
  <g transform="translate(580, 135)" filter="url(#shadow)">
    <rect width="210" height="100" rx="12" class="box-container" fill="#0b4884" />
    <text x="105" y="28" class="box-title">API Gateway Perimetral</text>
    <text x="105" y="44" class="box-tech">[Spring Cloud Gateway :18080]</text>
    <text x="105" y="64" class="box-desc">Rutas dinámicas lb://, CORS,</text>
    <text x="105" y="78" class="box-desc">JWT Relay &amp; Rate Limiting.</text>
  </g>
  <line x1="530" y1="185" x2="580" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#c4-arrow)" />

  <!-- 3. KEYCLOAK IAM -->
  <g transform="translate(830, 135)" filter="url(#shadow)">
    <rect width="210" height="100" rx="12" class="box-container" fill="#581c87" />
    <text x="105" y="28" class="box-title">Keycloak 26 Server</text>
    <text x="105" y="44" class="box-tech">[OIDC / OAuth 2.0 :18180]</text>
    <text x="105" y="64" class="box-desc">Emisión de tokens JWT RS256</text>
    <text x="105" y="78" class="box-desc">Roles ADMIN y CLIENTE.</text>
  </g>
  <line x1="790" y1="185" x2="830" y2="185" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#c4-arrow)" />

  <!-- 4. EUREKA & CONFIG SERVER -->
  <g transform="translate(1080, 135)" filter="url(#shadow)">
    <rect width="195" height="100" rx="12" class="box-container" fill="#0f766e" />
    <text x="97" y="28" class="box-title">Eureka &amp; Config Server</text>
    <text x="97" y="44" class="box-tech">[Eureka :18761 / Config :18888]</text>
    <text x="97" y="64" class="box-desc">Descubrimiento de servicios</text>
    <text x="97" y="78" class="box-desc">y perfiles centralizados.</text>
  </g>
  <line x1="1040" y1="185" x2="1080" y2="185" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#c4-arrow)" />

  <!-- ================= CAPA DE MICROSERVICIOS ================= -->
  
  <!-- pc-auth-ms -->
  <g transform="translate(320, 290)" filter="url(#shadow)">
    <rect width="180" height="110" rx="12" class="box-container" fill="#6d28d9" />
    <text x="90" y="26" class="box-title">pc-auth-ms</text>
    <text x="90" y="42" class="box-tech">[Spring Boot 3.4 :8087]</text>
    <text x="90" y="62" class="box-desc">Validación de identidades,</text>
    <text x="90" y="76" class="box-desc">sync con Keycloak y</text>
    <text x="90" y="90" class="box-desc">control de roles RBAC.</text>
  </g>

  <!-- pc-catalogo-ms -->
  <g transform="translate(520, 290)" filter="url(#shadow)">
    <rect width="180" height="110" rx="12" class="box-container" fill="#15803d" />
    <text x="90" y="26" class="box-title">pc-catalogo-ms</text>
    <text x="90" y="42" class="box-tech">[Spring Boot 3.4 :8081]</text>
    <text x="90" y="62" class="box-desc">Catálogo de hardware gamer,</text>
    <text x="90" y="76" class="box-desc">gestión de stock en tiempo real</text>
    <text x="90" y="90" class="box-desc">y filtros de compatibilidad.</text>
  </g>

  <!-- pc-cotizacion-ms -->
  <g transform="translate(720, 290)" filter="url(#shadow)">
    <rect width="180" height="110" rx="12" class="box-container" fill="#0369a1" />
    <text x="90" y="26" class="box-title">pc-cotizacion-ms</text>
    <text x="90" y="42" class="box-tech">[Spring Boot 3.4 :8089]</text>
    <text x="90" y="62" class="box-desc">Motor PC Builder en 28ms,</text>
    <text x="90" y="76" class="box-desc">validación Socket/Watts</text>
    <text x="90" y="90" class="box-desc">y proformas de 7 días.</text>
  </g>

  <!-- pc-orden-ms (TRANSACCIONAL) -->
  <g transform="translate(920, 290)" filter="url(#shadow)">
    <rect width="180" height="110" rx="12" class="box-container" fill="#1d4ed8" stroke="#3b82f6" stroke-width="2.5" />
    <rect x="10" y="5" width="160" height="16" rx="4" fill="#eff6ff" />
    <text x="90" y="17" font-size="8.5px" font-weight="900" fill="#1e40af" text-anchor="middle">ÚNICO TRANSACCIONAL</text>
    <text x="90" y="38" class="box-title">pc-orden-ms</text>
    <text x="90" y="52" class="box-tech">[Spring Boot 3.4 :8083]</text>
    <text x="90" y="70" class="box-desc">ACID, cabecera-detalle,</text>
    <text x="90" y="84" class="box-desc">cálculo legal IGV (18%),</text>
    <text x="90" y="98" class="box-desc">Saga y Kafka Producer.</text>
  </g>

  <!-- pc-pago-ms -->
  <g transform="translate(1120, 290)" filter="url(#shadow)">
    <rect width="160" height="110" rx="12" class="box-container" fill="#c2410c" />
    <text x="80" y="26" class="box-title">pc-pago-ms</text>
    <text x="80" y="42" class="box-tech">[Spring Boot 3.4 :8085]</text>
    <text x="80" y="62" class="box-desc">Mercado Pago SDK,</text>
    <text x="80" y="76" class="box-desc">Resilience4j Circuit Breaker,</text>
    <text x="80" y="90" class="box-desc">Webhook IPN &amp; Kafka.</text>
  </g>

  <!-- Líneas Gateway hacia los 5 microservicios -->
  <path d="M 685 235 L 685 260 L 410 260 L 410 290" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#c4-arrow)" />
  <path d="M 685 235 L 685 260 L 610 260 L 610 290" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#c4-arrow)" />
  <path d="M 685 235 L 685 260 L 810 260 L 810 290" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#c4-arrow)" />
  <path d="M 685 235 L 685 260 L 1010 260 L 1010 290" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#c4-arrow)" />
  <path d="M 685 235 L 685 260 L 1200 260 L 1200 290" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#c4-arrow)" />

  <!-- ================= CAPA DE BASES DE DATOS ================= -->
  
  <!-- DB Auth -->
  <g transform="translate(320, 450)" filter="url(#shadow)">
    <rect width="180" height="85" rx="10" class="box-db" fill="#4c1d95" />
    <text x="90" y="28" class="box-title">BD Auth</text>
    <text x="90" y="44" class="box-tech">[PostgreSQL 16 :5435]</text>
    <text x="90" y="64" class="box-desc">Usuarios, credenciales</text>
    <text x="90" y="76" class="box-desc">y asignaciones de roles.</text>
  </g>
  <line x1="410" y1="400" x2="410" y2="450" stroke="#6d28d9" stroke-width="2" marker-end="url(#c4-arrow)" />

  <!-- DB Catalogo -->
  <g transform="translate(520, 450)" filter="url(#shadow)">
    <rect width="180" height="85" rx="10" class="box-db" fill="#14532d" />
    <text x="90" y="28" class="box-title">BD Catálogo</text>
    <text x="90" y="44" class="box-tech">[PostgreSQL 16 :15432]</text>
    <text x="90" y="64" class="box-desc">Tablas de hardware,</text>
    <text x="90" y="76" class="box-desc">categorías e inventario.</text>
  </g>
  <line x1="610" y1="400" x2="610" y2="450" stroke="#15803d" stroke-width="2" marker-end="url(#c4-arrow)" />

  <!-- DB Cotizacion -->
  <g transform="translate(720, 450)" filter="url(#shadow)">
    <rect width="180" height="85" rx="10" class="box-db" fill="#0c4a6e" />
    <text x="90" y="28" class="box-title">BD Cotización</text>
    <text x="90" y="44" class="box-tech">[PostgreSQL 16 :5436]</text>
    <text x="90" y="64" class="box-desc">Cotizaciones gamer,</text>
    <text x="90" y="76" class="box-desc">proformas y compatibilidad.</text>
  </g>
  <line x1="810" y1="400" x2="810" y2="450" stroke="#0369a1" stroke-width="2" marker-end="url(#c4-arrow)" />

  <!-- DB Orden -->
  <g transform="translate(920, 450)" filter="url(#shadow)">
    <rect width="180" height="85" rx="10" class="box-db" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2" />
    <text x="90" y="28" class="box-title">BD Órdenes</text>
    <text x="90" y="44" class="box-tech">[PostgreSQL 16 :5433]</text>
    <text x="90" y="64" class="box-desc">Esquema ACID: cabecera,</text>
    <text x="90" y="76" class="box-desc">detalles e impuestos IGV.</text>
  </g>
  <line x1="1010" y1="400" x2="1010" y2="450" stroke="#1d4ed8" stroke-width="2" marker-end="url(#c4-arrow)" />

  <!-- DB Pago -->
  <g transform="translate(1120, 450)" filter="url(#shadow)">
    <rect width="160" height="85" rx="10" class="box-db" fill="#7c2d12" />
    <text x="80" y="28" class="box-title">BD Pagos</text>
    <text x="80" y="44" class="box-tech">[PostgreSQL 16 :5434]</text>
    <text x="80" y="64" class="box-desc">Transacciones y auditoría</text>
    <text x="80" y="76" class="box-desc">financiera Mercado Pago.</text>
  </g>
  <line x1="1200" y1="400" x2="1200" y2="450" stroke="#ea580c" stroke-width="2" marker-end="url(#c4-arrow)" />

  <!-- ================= APACHE KAFKA BUS ================= -->
  <g transform="translate(320, 580)" filter="url(#shadow)">
    <rect width="960" height="80" rx="14" fill="#18181b" stroke="#f97316" stroke-width="2.5" />
    <text x="30" y="45" font-size="18px">⚡</text>
    <text x="65" y="38" font-size="15px" font-weight="900" fill="#ffffff">APACHE KAFKA EVENT BUS (EVENT-DRIVEN ARCHITECTURE)</text>
    <text x="65" y="58" class="mono" font-size="11px" font-weight="700" fill="#fb923c">Broker :9092  |  Kafka UI :18085  |  Desacoplamiento asíncrono y tolerancia a caídas</text>
    
    <g transform="translate(680, 20)">
      <rect width="130" height="40" rx="8" fill="#27272a" stroke="#f97316" />
      <text x="65" y="18" text-anchor="middle" font-size="10px" font-weight="800" fill="#fed7aa">orden.creada</text>
      <text x="65" y="32" text-anchor="middle" font-size="8.5px" fill="#fdba74">Emite Orden MS</text>
    </g>
    <g transform="translate(820, 20)">
      <rect width="130" height="40" rx="8" fill="#27272a" stroke="#22c55e" />
      <text x="65" y="18" text-anchor="middle" font-size="10px" font-weight="800" fill="#bbf7d0">pago.confirmado</text>
      <text x="65" y="32" text-anchor="middle" font-size="8.5px" fill="#86efac">Emite Pago MS</text>
    </g>
  </g>

  <!-- Flechas Kafka -->
  <line x1="1010" y1="400" x2="1010" y2="580" stroke="#f97316" stroke-width="2" marker-end="url(#c4-arrow)" />
  <line x1="1200" y1="400" x2="1200" y2="580" stroke="#f97316" stroke-width="2" marker-end="url(#c4-arrow)" />

  <!-- ================= CAPA DE OBSERVABILIDAD ================= -->
  <g transform="translate(320, 700)" filter="url(#shadow)">
    <rect width="960" height="95" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8" />
    <text x="30" y="32" font-size="14px" font-weight="900" fill="#0f172a">TELEMETRÍA &amp; OBSERVABILIDAD DISTRIBUIDA (EN TIEMPO REAL)</text>
    
    <!-- Prometheus -->
    <g transform="translate(25, 45)">
      <rect width="210" height="38" rx="8" fill="#fff1f2" stroke="#e11d48" />
      <text x="15" y="24" font-size="14px">🔥</text>
      <text x="40" y="18" font-size="11px" font-weight="800" fill="#9f1239">Prometheus :9090</text>
      <text x="40" y="30" font-size="8.5px" fill="#e11d48">Métricas Actuator / JVM</text>
    </g>

    <!-- Grafana -->
    <g transform="translate(260, 45)">
      <rect width="210" height="38" rx="8" fill="#fff7ed" stroke="#ea580c" />
      <text x="15" y="24" font-size="14px">📊</text>
      <text x="40" y="18" font-size="11px" font-weight="800" fill="#9a3412">Grafana :3000</text>
      <text x="40" y="30" font-size="8.5px" fill="#ea580c">Dashboards en vivo</text>
    </g>

    <!-- Loki & Promtail -->
    <g transform="translate(495, 45)">
      <rect width="210" height="38" rx="8" fill="#f8fafc" stroke="#64748b" />
      <text x="15" y="24" font-size="14px">📑</text>
      <text x="40" y="18" font-size="11px" font-weight="800" fill="#334155">Loki :3100</text>
      <text x="40" y="30" font-size="8.5px" fill="#64748b">Logs agregados</text>
    </g>

    <!-- Swagger UI -->
    <g transform="translate(730, 45)">
      <rect width="205" height="38" rx="8" fill="#f0fdf4" stroke="#16a34a" />
      <text x="15" y="24" font-size="14px">📖</text>
      <text x="40" y="18" font-size="11px" font-weight="800" fill="#14532d">Swagger UI 3.0</text>
      <text x="40" y="30" font-size="8.5px" fill="#16a34a">Contratos en los 5 MS</text>
    </g>
  </g>

  <!-- ================= SISTEMAS EXTERNOS (DERECHA) ================= -->
  
  <!-- Mercado Pago -->
  <g transform="translate(1330, 290)" filter="url(#shadow)">
    <rect width="230" height="110" rx="12" class="box-external" />
    <text x="115" y="28" class="box-title">Mercado Pago Sandbox</text>
    <text x="115" y="44" class="box-tech">[API Externa HTTPS]</text>
    <text x="115" y="64" class="box-desc">Checkout Pro, pagos reales</text>
    <text x="115" y="78" class="box-desc">y webhooks IPN con</text>
    <text x="115" y="92" class="box-desc">firmas criptográficas.</text>
  </g>
  <line x1="1280" y1="345" x2="1330" y2="345" stroke="#475569" stroke-width="2" marker-end="url(#c4-arrow)" />

  <!-- SUNAT -->
  <g transform="translate(1330, 450)" filter="url(#shadow)">
    <rect width="230" height="85" rx="12" class="box-external" />
    <text x="115" y="26" class="box-title">SUNAT / Facturación</text>
    <text x="115" y="42" class="box-tech">[Cumplimiento Fiscal]</text>
    <text x="115" y="62" class="box-desc">Cálculo obligatorio</text>
    <text x="115" y="74" class="box-desc">de IGV 18% por orden.</text>
  </g>
  <path d="M 1100 345 L 1290 345 L 1290 492 L 1330 492" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#c4-arrow)" />

  <!-- ================= LEYENDA ================= -->
  <g transform="translate(320, 825)" filter="url(#shadow)">
    <rect width="960" height="135" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8" />
    <text x="30" y="28" font-size="12px" font-weight="900" fill="#0f172a">LEYENDA C4 CONTAINER (DECISIONES DE ARQUITECTURA)</text>

    <g transform="translate(30, 48)">
      <rect width="18" height="18" rx="4" fill="#08427b" />
      <text x="28" y="14" font-size="10.5px" font-weight="700" fill="#1e293b">Persona / Usuario</text>

      <rect x="180" width="18" height="18" rx="4" fill="#1168bd" />
      <text x="208" y="14" font-size="10.5px" font-weight="700" fill="#1e293b">Contenedor / Microservicio</text>

      <rect x="420" width="18" height="18" rx="4" fill="#2b78e4" />
      <text x="448" y="14" font-size="10.5px" font-weight="700" fill="#1e293b">Base de Datos PostgreSQL 16</text>

      <rect x="670" width="18" height="18" rx="4" fill="#686868" />
      <text x="698" y="14" font-size="10.5px" font-weight="700" fill="#1e293b">Sistema Externo (Mercado Pago, SUNAT)</text>
    </g>

    <g transform="translate(30, 85)">
      <line x1="0" y1="10" x2="35" y2="10" stroke="#1e293b" stroke-width="2" marker-end="url(#c4-arrow)" />
      <text x="45" y="14" font-size="10px" font-weight="700" fill="#334155">Invocación Síncrona REST / OpenFeign</text>

      <line x1="280" y1="10" x2="315" y2="10" stroke="#f97316" stroke-width="2.5" marker-end="url(#c4-arrow)" />
      <text x="325" y="14" font-size="10px" font-weight="700" fill="#ea580c">Eventos Asíncronos Apache Kafka (:9092)</text>

      <line x1="570" y1="10" x2="605" y2="10" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#c4-arrow)" />
      <text x="615" y="14" font-size="10px" font-weight="700" fill="#0284c7">Heartbeat Eureka / OIDC Token Keycloak</text>
    </g>
  </g>

</svg>