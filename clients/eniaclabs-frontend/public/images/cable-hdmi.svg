<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  
  <!-- Cable Coil Loop in background -->
  <path d="M 90 280 C 60 210, 100 130, 200 130 C 310 130, 340 230, 280 290 C 230 340, 130 330, 110 270" 
        fill="none" stroke="#27272a" stroke-width="26" stroke-linecap="round"/>
  <path d="M 90 280 C 60 210, 100 130, 200 130 C 310 130, 340 230, 280 290 C 230 340, 130 330, 110 270" 
        fill="none" stroke="#3f3f46" stroke-width="20" stroke-linecap="round"/>

  <!-- HDMI Connector Body -->
  <g transform="translate(140, 100) rotate(15)">
    <!-- Cable entering plug -->
    <path d="M 60 160 L 60 210" stroke="#3f3f46" stroke-width="22" stroke-linecap="round"/>
    <rect x="48" y="145" width="24" height="20" rx="4" fill="#18181b"/>
    
    <!-- Plug housing -->
    <rect x="25" y="55" width="70" height="95" rx="10" fill="url(#metal)" stroke="#71717a" stroke-width="2"/>
    <rect x="33" y="65" width="54" height="30" rx="4" fill="#18181b"/>
    
    <!-- Brand label -->
    <text x="60" y="84" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="url(#gold)" text-anchor="middle" letter-spacing="1">ENIAC</text>
    <text x="60" y="112" font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="#a1a1aa" text-anchor="middle">HDMI 2.1 8K</text>
    <circle cx="60" cy="132" r="3" fill="#22c55e"/>

    <!-- Gold-plated HDMI plug tip -->
    <path d="M 33 55 L 33 15 L 43 5 L 77 5 L 87 15 L 87 55 Z" fill="url(#gold)" stroke="#d97706" stroke-width="1.5"/>
    <!-- Inside connector pins cutout -->
    <path d="M 40 45 L 40 22 L 46 16 L 74 16 L 80 22 L 80 45 Z" fill="#18181b"/>
    <!-- Gold pins row -->
    <rect x="45" y="24" width="30" height="5" rx="1" fill="url(#gold)"/>
    <rect x="47" y="32" width="26" height="4" rx="1" fill="url(#gold)"/>
  </g>

  <!-- Spec Badges -->
  <g transform="translate(30, 40)">
    <rect width="105" height="28" rx="8" fill="#ff6600"/>
    <text x="52" y="18" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">S/ 10.00</text>
  </g>
  <g transform="translate(265, 40)">
    <rect width="105" height="28" rx="8" fill="#742284"/>
    <text x="52" y="18" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">ULTRA 8K</text>
  </g>
</svg>
