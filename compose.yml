name: eniaclabs-ecosistema

services:
  # ==========================================
  # BASES DE DATOS INDEPENDIENTES (PostgreSQL)
  # ==========================================
  eniaclabs-db-catalogo:
    image: postgres:16-alpine
    container_name: eniaclabs-db-catalogo
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: eniaclabs_catalogo_db
      POSTGRES_USER: eniaclabs
      POSTGRES_PASSWORD: eniaclabs
    volumes:
      - eniaclabs_catalogo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eniaclabs -d eniaclabs_catalogo_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eniaclabs-network

  eniaclabs-db-orden:
    image: postgres:16-alpine
    container_name: eniaclabs-db-orden
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: eniaclabs_orden_db
      POSTGRES_USER: eniaclabs
      POSTGRES_PASSWORD: eniaclabs
    volumes:
      - eniaclabs_orden_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eniaclabs -d eniaclabs_orden_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eniaclabs-network

  eniaclabs-db-pago:
    image: postgres:16-alpine
    container_name: eniaclabs-db-pago
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: eniaclabs_pago_db
      POSTGRES_USER: eniaclabs
      POSTGRES_PASSWORD: eniaclabs
    volumes:
      - eniaclabs_pago_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eniaclabs -d eniaclabs_pago_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eniaclabs-network

  eniaclabs-db-cotizacion:
    image: postgres:16-alpine
    container_name: eniaclabs-db-cotizacion
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: eniaclabs_cotizacion_db
      POSTGRES_USER: eniaclabs
      POSTGRES_PASSWORD: eniaclabs
    volumes:
      - eniaclabs_cotizacion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eniaclabs -d eniaclabs_cotizacion_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eniaclabs-network

  # ==========================================
  # SERVIDORES DE INFRAESTRUCTURA SPRING CLOUD
  # ==========================================
  pc-config:
    build:
      context: ./infra/pc-config
      dockerfile: Dockerfile
    container_name: eniaclabs-config
    restart: unless-stopped
    ports:
      - "18888:8888"
    volumes:
      - ./infra/pc-config/config-repo:/config-repo
    environment:
      SERVER_PORT: 8888
      SPRING_PROFILES_ACTIVE: native
      CONFIG_REPO_LOCATION: file:/config-repo
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - eniaclabs-network

  pc-eureka:
    build:
      context: ./infra/pc-eureka
      dockerfile: Dockerfile
    container_name: eniaclabs-eureka
    restart: unless-stopped
    ports:
      - "18761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://pc-config:8888
    depends_on:
      pc-config:
        condition: service_healthy
    networks:
      - eniaclabs-network

  pc-gateway:
    build:
      context: ./infra/pc-gateway
      dockerfile: Dockerfile
    container_name: eniaclabs-gateway
    restart: unless-stopped
    ports:
      - "18080:28080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://pc-config:8888
    depends_on:
      - pc-eureka
    networks:
      - eniaclabs-network

  # ==========================================
  # MICROSERVICIOS DE NEGOCIO (4 TOTAL = 2 POR ALUMNO)
  # ==========================================
  # 1. Eliceo Parillo: No Transaccional
  pc-catalogo-ms:
    build:
      context: ./pc-catalogo-ms
      dockerfile: Dockerfile
    container_name: eniaclabs-catalogo-ms
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://pc-config:8888
      DB_HOST: eniaclabs-db-catalogo
      DB_PORT: 5432
      DB_USER: eniaclabs
      DB_PASS: eniaclabs
    depends_on:
      eniaclabs-db-catalogo:
        condition: service_healthy
      pc-eureka:
        condition: service_started
    networks:
      - eniaclabs-network

  # 2. Eliceo Parillo: UNICO MICROSERVICIO TRANSACCIONAL
  pc-orden-ms:
    build:
      context: ./pc-orden-ms
      dockerfile: Dockerfile
    container_name: eniaclabs-orden-ms
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://pc-config:8888
      DB_HOST: eniaclabs-db-orden
      DB_PORT: 5432
      DB_USER: eniaclabs
      DB_PASS: eniaclabs
    depends_on:
      eniaclabs-db-orden:
        condition: service_healthy
      pc-eureka:
        condition: service_started
    networks:
      - eniaclabs-network

  # 3. Laura Vargas: No Transaccional (Adaptador Pasarela Externa)
  pc-pago-ms:
    build:
      context: ./pc-pago-ms
      dockerfile: Dockerfile
    container_name: eniaclabs-pago-ms
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://pc-config:8888
      DB_HOST: eniaclabs-db-pago
      DB_PORT: 5432
      DB_USER: eniaclabs
      DB_PASS: eniaclabs
    depends_on:
      eniaclabs-db-pago:
        condition: service_healthy
      pc-eureka:
        condition: service_started
    networks:
      - eniaclabs-network

  # 4. Laura Vargas: No Transaccional (Cotizador PC Gamer / Vende el Sistema)
  pc-cotizacion-ms:
    build:
      context: ./pc-cotizacion-ms
      dockerfile: Dockerfile
    container_name: eniaclabs-cotizacion-ms
    restart: unless-stopped
    ports:
      - "8089:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://pc-config:8888
      DB_HOST: eniaclabs-db-cotizacion
      DB_PORT: 5432
      DB_USER: eniaclabs
      DB_PASS: eniaclabs
    depends_on:
      eniaclabs-db-cotizacion:
        condition: service_healthy
      pc-eureka:
        condition: service_started
    networks:
      - eniaclabs-network

  # ==========================================
  # STACK DE MONITOREO Y OBSERVABILIDAD
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: eniaclabs-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - eniaclabs_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - eniaclabs-network

  grafana:
    image: grafana/grafana:latest
    container_name: eniaclabs-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - eniaclabs_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - eniaclabs-network


  loki:
    image: grafana/loki:latest
    user: root
    container_name: eniaclabs-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./infra/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - eniaclabs_loki_data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - eniaclabs-network

  promtail:
    image: grafana/promtail:latest
    container_name: eniaclabs-promtail
    restart: unless-stopped
    ports:
      - "9080:9080"
    volumes:
      - ./infra/monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - eniaclabs-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: eniaclabs-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - eniaclabs-network

volumes:
  eniaclabs_catalogo_pgdata:
  eniaclabs_orden_pgdata:
  eniaclabs_pago_pgdata:
  eniaclabs_cotizacion_pgdata:
  eniaclabs_prometheus_data:
  eniaclabs_grafana_data:
  eniaclabs_loki_data:

networks:
  eniaclabs-network:
    name: eniaclabs-network
