name: eniaclabs-ecosistema

services:
  # ==========================================
  # BASES DE DATOS INDEPENDIENTES (PostgreSQL)
  # ==========================================
  eniaclabs-db-catalogo:
    image: postgres:16-alpine
    container_name: eniaclabs-db-catalogo
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: eniaclabs_catalogo_db
      POSTGRES_USER: eniaclabs
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eniaclabs}
    volumes:
      - eniaclabs_catalogo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eniaclabs -d eniaclabs_catalogo_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eniaclabs-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  eniaclabs-db-orden:
    image: postgres:16-alpine
    container_name: eniaclabs-db-orden
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: eniaclabs_orden_db
      POSTGRES_USER: eniaclabs
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eniaclabs}
    volumes:
      - eniaclabs_orden_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eniaclabs -d eniaclabs_orden_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eniaclabs-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  eniaclabs-db-pago:
    image: postgres:16-alpine
    container_name: eniaclabs-db-pago
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: eniaclabs_pago_db
      POSTGRES_USER: eniaclabs
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eniaclabs}
    volumes:
      - eniaclabs_pago_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eniaclabs -d eniaclabs_pago_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eniaclabs-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  eniaclabs-db-cotizacion:
    image: postgres:16-alpine
    container_name: eniaclabs-db-cotizacion
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: eniaclabs_cotizacion_db
      POSTGRES_USER: eniaclabs
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eniaclabs}
    volumes:
      - eniaclabs_cotizacion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eniaclabs -d eniaclabs_cotizacion_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eniaclabs-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  eniaclabs-db-auth:
    image: postgres:16-alpine
    container_name: eniaclabs-db-auth
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: eniaclabs_auth_db
      POSTGRES_USER: eniaclabs
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eniaclabs}
    volumes:
      - eniaclabs_auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eniaclabs -d eniaclabs_auth_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eniaclabs-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  eniaclabs-redis:
    image: redis:7-alpine
    container_name: eniaclabs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - eniaclabs_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eniaclabs-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ==========================================
  # MENSAJERÍA ASÍNCRONA KAFKA (S08)
  # ==========================================
  eniaclabs-kafka:
    image: apache/kafka:latest
    container_name: eniaclabs-kafka
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://eniaclabs-kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@eniaclabs-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - eniaclabs-network

  eniaclabs-kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: eniaclabs-kafka-ui
    restart: unless-stopped
    ports:
      - "18085:8080"
      - "28085:8080"
    depends_on:
      - eniaclabs-kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: eniaclabs-prod
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: eniaclabs-kafka:9092
    networks:
      - eniaclabs-network

  # ==========================================
  # SERVIDORES DE INFRAESTRUCTURA SPRING CLOUD
  # ==========================================
  pc-config:
    build:
      context: ./infra/pc-config
      dockerfile: Dockerfile
    container_name: eniaclabs-config
    restart: unless-stopped
    ports:
      - "18888:8888"
    volumes:
      - ./infra/pc-config/config-repo:/config-repo
    environment:
      SERVER_PORT: 8888
      SPRING_PROFILES_ACTIVE: native
      CONFIG_REPO_LOCATION: file:/config-repo
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - eniaclabs-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  pc-eureka:
    build:
      context: ./infra/pc-eureka
      dockerfile: Dockerfile
    container_name: eniaclabs-eureka
    restart: unless-stopped
    ports:
      - "18761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://pc-config:8888
    depends_on:
      pc-config:
        condition: service_healthy
    networks:
      - eniaclabs-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  pc-gateway:
    build:
      context: ./infra/pc-gateway
      dockerfile: Dockerfile
    container_name: eniaclabs-gateway
    restart: unless-stopped
    ports:
      - "18080:28080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://pc-config:8888
      SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"
      JDK_JAVA_OPTIONS: "--add-opens java.base/java.net=ALL-UNNAMED --add-opens java.base/sun.net.www.protocol.http=ALL-UNNAMED"
    depends_on:
      - pc-eureka
    networks:
      - eniaclabs-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ==========================================
  # MICROSERVICIOS DE NEGOCIO (4 TOTAL)
  # ==========================================
  # 1. Eliceo Parillo: No Transaccional
  pc-catalogo-ms:
    build:
      context: ./pc-catalogo-ms
      dockerfile: Dockerfile
    container_name: eniaclabs-catalogo-ms
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://pc-config:8888
      DB_HOST: eniaclabs-db-catalogo
      DB_PORT: 5432
      DB_USER: eniaclabs
      DB_PASS: ${DB_PASSWORD:-eniaclabs}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      eniaclabs-db-catalogo:
        condition: service_healthy
      pc-eureka:
        condition: service_started
    networks:
      - eniaclabs-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # 2. Eliceo Parillo: UNICO MICROSERVICIO TRANSACCIONAL
  pc-orden-ms:
    build:
      context: ./pc-orden-ms
      dockerfile: Dockerfile
    container_name: eniaclabs-orden-ms
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://pc-config:8888
      DB_HOST: eniaclabs-db-orden
      DB_PORT: 5432
      DB_USER: eniaclabs
      DB_PASS: ${DB_PASSWORD:-eniaclabs}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      eniaclabs-db-orden:
        condition: service_healthy
      pc-eureka:
        condition: service_started
    networks:
      - eniaclabs-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # 3. Laura Vargas: No Transaccional (Adaptador Pasarela Externa)
  pc-pago-ms:
    build:
      context: ./pc-pago-ms
      dockerfile: Dockerfile
    container_name: eniaclabs-pago-ms
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://pc-config:8888
      FRONTEND_URL: https://eniaclabs-nine.vercel.app
      MP_ACCESS_TOKEN: APP_USR-7798988609356730-111819-96e585696ba88ed36d038c742adc400c-3649448406
      MP_PUBLIC_KEY: APP_USR-9f3f0419-e6bf-4800-ab6b-50bfd5db448e
      DB_HOST: eniaclabs-db-pago
      DB_PORT: 5432
      DB_USER: eniaclabs
      DB_PASS: ${DB_PASSWORD:-eniaclabs}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      eniaclabs-db-pago:
        condition: service_healthy
      pc-eureka:
        condition: service_started
    networks:
      - eniaclabs-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # 4. Laura Vargas: No Transaccional (Cotizador PC Gamer / Vende el Sistema)
  pc-cotizacion-ms:
    build:
      context: ./pc-cotizacion-ms
      dockerfile: Dockerfile
    container_name: eniaclabs-cotizacion-ms
    restart: unless-stopped
    ports:
      - "8089:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://pc-config:8888
      DB_HOST: eniaclabs-db-cotizacion
      DB_PORT: 5432
      DB_USER: eniaclabs
      DB_PASS: ${DB_PASSWORD:-eniaclabs}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      eniaclabs-db-cotizacion:
        condition: service_healthy
      pc-eureka:
        condition: service_started
    networks:
      - eniaclabs-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # 5. Seguridad y Autenticación Centralizada JWT
  pc-auth-ms:
    build:
      context: ./pc-auth-ms
      dockerfile: Dockerfile
    container_name: eniaclabs-auth-ms
    restart: unless-stopped
    ports:
      - "8087:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://pc-config:8888
      DB_HOST: eniaclabs-db-auth
      DB_PORT: 5432
      DB_USER: eniaclabs
      DB_PASS: ${DB_PASSWORD:-eniaclabs}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      eniaclabs-db-auth:
        condition: service_healthy
      pc-eureka:
        condition: service_started
    networks:
      - eniaclabs-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ==========================================
  # STACK DE MONITOREO Y OBSERVABILIDAD
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: eniaclabs-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - eniaclabs_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - eniaclabs-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    container_name: eniaclabs-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - eniaclabs_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - eniaclabs-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  loki:
    image: grafana/loki:latest
    user: root
    container_name: eniaclabs-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./infra/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - eniaclabs_loki_data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - eniaclabs-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  promtail:
    image: grafana/promtail:latest
    container_name: eniaclabs-promtail
    restart: unless-stopped
    ports:
      - "9080:9080"
    volumes:
      - ./infra/monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - eniaclabs-network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  node-exporter:
    image: prom/node-exporter:latest
    container_name: eniaclabs-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - eniaclabs-network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

volumes:
  eniaclabs_catalogo_pgdata:
  eniaclabs_orden_pgdata:
  eniaclabs_pago_pgdata:
  eniaclabs_cotizacion_pgdata:
  eniaclabs_auth_pgdata:
  eniaclabs_redis_data:
  eniaclabs_prometheus_data:
  eniaclabs_grafana_data:
  eniaclabs_loki_data:

networks:
  eniaclabs-network:
    name: eniaclabs-network