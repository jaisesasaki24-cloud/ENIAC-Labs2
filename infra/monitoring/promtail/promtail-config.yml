server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: eniaclabs-docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: eniaclabs-microservices
          __path__: /var/lib/docker/containers/*/*-json.log

  - job_name: eniaclabs-app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: eniaclabs-apps
          __path__: /var/log/eniaclabs/*.log

  - job_name: eniaclabs-keycloak
    static_configs:
      - targets: [localhost]
        labels:
          application: pc-keycloak
          job: pc-keycloak
          __path__: /var/log/eniaclabs-keycloak/*.log

  - job_name: eniaclabs-gateway
    static_configs:
      - targets: [localhost]
        labels:
          application: pc-gateway
          job: pc-gateway
          __path__: /var/log/eniaclabs-gateway/*.log

  - job_name: eniaclabs-pago
    static_configs:
      - targets: [localhost]
        labels:
          application: pc-pago-ms
          job: pc-pago-ms
          __path__: /var/log/eniaclabs-pago/*.log