services:
  prometheus:
    image: prom/prometheus:latest
    container_name: eniaclabs-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - eniaclabs_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - eniaclabs-network

  grafana:
    image: grafana/grafana:latest
    container_name: eniaclabs-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - eniaclabs_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - eniaclabs-network

  loki:
    image: grafana/loki:latest
    container_name: eniaclabs-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - eniaclabs_loki_data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - eniaclabs-network

  promtail:
    image: grafana/promtail:latest
    container_name: eniaclabs-promtail
    restart: unless-stopped
    ports:
      - "9080:9080"
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - eniaclabs-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: eniaclabs-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - eniaclabs-network

volumes:
  eniaclabs_prometheus_data:
  eniaclabs_grafana_data:
  eniaclabs_loki_data:

networks:
  eniaclabs-network:
    name: eniaclabs-network
    external: true