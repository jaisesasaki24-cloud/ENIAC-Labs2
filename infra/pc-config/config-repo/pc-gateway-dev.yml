server:
  port: 18080

eniaclabs:
  cors:
    allowed-origins: http://localhost:4200,http://127.0.0.1:4200,https://localhost:4200,https://127.0.0.1:4200,https://eniaclabs-nine.vercel.app,https://*.vercel.app,http://eniaclabs.chilecentral.cloudapp.azure.com


spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:18180/realms/eniaclabs
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: pc-catalogo-categorias
              uri: lb://PC-CATALOGO-MS
              predicates:
                - Path=/api/v1/categorias/**
            - id: pc-catalogo-productos
              uri: lb://PC-CATALOGO-MS
              predicates:
                - Path=/api/v1/productos/**
            - id: pc-orden-ms
              uri: lb://PC-ORDEN-MS
              predicates:
                - Path=/api/v1/ordenes/**
            - id: pc-pago-ms
              uri: lb://PC-PAGO-MS
              predicates:
                - Path=/api/v1/pagos/**
            - id: pc-pagos-ms
              uri: lb://PC-PAGO-MS
              predicates:
                - Path=/api/pagos/**
            - id: pc-payments-ms
              uri: lb://PC-PAGO-MS
              predicates:
                - Path=/api/payments/**
            - id: pc-cotizacion-ms
              uri: lb://PC-COTIZACION-MS
              predicates:
                - Path=/api/v1/cotizaciones/**
            - id: pc-auth-ms
              uri: lb://PC-AUTH-MS
              predicates:
                - Path=/api/v1/auth/**
            - id: pc-auth-usuarios
              uri: lb://PC-AUTH-MS
              predicates:
                - Path=/api/v1/usuarios/**

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${random.uuid}
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: http://localhost:18761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always