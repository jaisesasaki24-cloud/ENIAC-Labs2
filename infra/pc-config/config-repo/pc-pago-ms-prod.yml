server:
  port: 8080

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:PROD-TOKEN}
  public-key: ${MP_PUBLIC_KEY:PROD-KEY}
  webhook-secret: ${MP_WEBHOOK_SECRET:PROD-SECRET}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:eniaclabs-db-pago}:${DB_PORT:5432}/eniaclabs_pago_db
    username: ${DB_USER:eniaclabs}
    password: ${DB_PASS:eniaclabs_secret_pass}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  kafka:
    bootstrap-servers: eniaclabs-kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: pc-pago-ms
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: pe.edu.upeu.eniaclabs.pago.event.OrdenCreadaEvento
        spring.json.trusted.packages: pe.edu.upeu.eniaclabs.pago.event
        spring.json.use.type.headers: false

app:
  kafka:
    topic:
      ordenes: orden-eventos
      pagos: pago-eventos

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

eureka:
  instance:
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://pc-eureka:8761/eureka