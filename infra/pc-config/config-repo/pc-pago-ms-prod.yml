server:
  port: 8080

frontend:
  url: ${FRONTEND_URL:https://eniaclabs-nine.vercel.app}

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:APP_USR-7798988609356730-111819-96e585696ba88ed36d038c742adc400c-3649448406}
  public-key: ${MP_PUBLIC_KEY:APP_USR-9f3f0419-e6bf-4800-ab6b-50bfd5db448e}
  currency-id: ${MP_CURRENCY_ID:PEN}
  webhook-secret: ${MP_WEBHOOK_SECRET:PROD-SECRET}
  auto-return: approved

culqi:
  secret-key: ${CULQI_SECRET_KEY:sk_test_g83TjoIFV36RcQqK}
  public-key: ${CULQI_PUBLIC_KEY:pk_test_S6cbeiPZqYemD1lH}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:eniaclabs-db-pago}:${DB_PORT:5432}/eniaclabs_pago_db
    username: ${DB_USER:eniaclabs}
    password: ${DB_PASS:eniaclabs_secret_pass}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://eniaclabs-keycloak:8080/realms/eniaclabs

  kafka:
    bootstrap-servers: eniaclabs-kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: pc-pago-ms
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: pe.edu.upeu.eniaclabs.pago.event.OrdenCreadaEvento
        spring.json.trusted.packages: pe.edu.upeu.eniaclabs.pago.event
        spring.json.use.type.headers: false

app:
  kafka:
    topic:
      ordenes: orden-eventos
      pagos: pago-eventos

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://pc-eureka:8761/eureka