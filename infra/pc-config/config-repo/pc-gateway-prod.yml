server:
  port: 28080

eniaclabs:
  cors:
    allowed-origins: http://localhost:4200,http://127.0.0.1:4200,https://localhost:4200,https://127.0.0.1:4200,https://eniaclabs-nine.vercel.app,https://*.vercel.app,http://eniaclabs.chilecentral.cloudapp.azure.com

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://eniaclabs-keycloak:8080/realms/eniaclabs
  http:
    client:
      factory: jdk
  main:
    allow-bean-definition-overriding: true
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: pc-catalogo-categorias
          uri: http://pc-catalogo-ms:8080
          predicates:
            - Path=/api/v1/categorias/**
        - id: pc-catalogo-productos
          uri: http://pc-catalogo-ms:8080
          predicates:
            - Path=/api/v1/productos/**
        - id: pc-orden-ms
          uri: http://pc-orden-ms:8080
          predicates:
            - Path=/api/v1/ordenes/**
        - id: pc-pago-ms
          uri: http://pc-pago-ms:8080
          predicates:
            - Path=/api/v1/pagos/**
        - id: pc-payments-ms
          uri: http://pc-pago-ms:8080
          predicates:
            - Path=/api/payments/**
        - id: pc-cotizacion-ms
          uri: http://pc-cotizacion-ms:8080
          predicates:
            - Path=/api/v1/cotizaciones/**
        - id: pc-auth-ms
          uri: http://pc-auth-ms:8080
          predicates:
            - Path=/api/v1/auth/**
        - id: pc-auth-usuarios
          uri: http://pc-auth-ms:8080
          predicates:
            - Path=/api/v1/usuarios/**
      mvc:
        routes:
          - id: pc-catalogo-categorias
            uri: http://pc-catalogo-ms:8080
            predicates:
              - Path=/api/v1/categorias/**
          - id: pc-catalogo-productos
            uri: http://pc-catalogo-ms:8080
            predicates:
              - Path=/api/v1/productos/**
          - id: pc-orden-ms
            uri: http://pc-orden-ms:8080
            predicates:
              - Path=/api/v1/ordenes/**
          - id: pc-pago-ms
            uri: http://pc-pago-ms:8080
            predicates:
              - Path=/api/v1/pagos/**
          - id: pc-payments-ms
            uri: http://pc-pago-ms:8080
            predicates:
              - Path=/api/payments/**
          - id: pc-cotizacion-ms
            uri: http://pc-cotizacion-ms:8080
            predicates:
              - Path=/api/v1/cotizaciones/**
          - id: pc-auth-ms
            uri: http://pc-auth-ms:8080
            predicates:
              - Path=/api/v1/auth/**
          - id: pc-auth-usuarios
            uri: http://pc-auth-ms:8080
            predicates:
              - Path=/api/v1/usuarios/**
      server:
        webmvc:
          routes:
            - id: pc-catalogo-categorias
              uri: http://pc-catalogo-ms:8080
              predicates:
                - Path=/api/v1/categorias/**
            - id: pc-catalogo-productos
              uri: http://pc-catalogo-ms:8080
              predicates:
                - Path=/api/v1/productos/**
            - id: pc-orden-ms
              uri: http://pc-orden-ms:8080
              predicates:
                - Path=/api/v1/ordenes/**
            - id: pc-pago-ms
              uri: http://pc-pago-ms:8080
              predicates:
                - Path=/api/v1/pagos/**
            - id: pc-payments-ms
              uri: http://pc-pago-ms:8080
              predicates:
                - Path=/api/payments/**
            - id: pc-cotizacion-ms
              uri: http://pc-cotizacion-ms:8080
              predicates:
                - Path=/api/v1/cotizaciones/**
            - id: pc-auth-ms
              uri: http://pc-auth-ms:8080
              predicates:
                - Path=/api/v1/auth/**
            - id: pc-auth-usuarios
              uri: http://pc-auth-ms:8080
              predicates:
                - Path=/api/v1/usuarios/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    http-client:
      type: resttemplate
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://pc-eureka:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      validate-group-membership: false
      probes:
        enabled: false