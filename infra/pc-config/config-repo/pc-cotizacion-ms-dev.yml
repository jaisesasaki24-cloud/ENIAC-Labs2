server:
  port: 8089

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:eniaclabs_cotizacion_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USER:eniaclabs}
    password: ${DB_PASS:eniaclabs}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    pe.edu.upeu.eniaclabs: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka

eniaclabs:
  ai:
    nemotron:
      base-url: https://integrate.api.nvidia.com/v1
      api-key: ${NVIDIA_API_KEY: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}
      model: nvidia/nemotron-3-ultra-550b-a55b
      enabled: true
